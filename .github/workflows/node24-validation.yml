name: Node 24 isolated image validation
on:
  push:
    branches: ['codex/node24-ub56qf-20261024']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/qaiserali1/admin_panel:node24-24.22.1-ub56qf
          labels: |
            org.opencontainers.image.source=https://github.com/qaiserali1/Admin_Panel
            org.opencontainers.image.revision=${{ github.sha }}
            io.coolify.node24.original-revision=09acf7ceb19b8413524a97ad529f3de03253d627
          cache-from: type=gha
          cache-to: type=gha,mode=max
